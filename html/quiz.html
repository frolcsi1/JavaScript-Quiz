<!DOCTYPE html>
<html lang="hu - HU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="error-container" id="error-message" hidden></div>

    <div class="quiz-container">
        <h1 id="question-text" class="pre-wrap">Feladat</h1>

        <input type="radio" name="answer" id="o0" value="0">
        <label class="pre-wrap" for="o0" id="o0-label">Válasz 1</label>
        <br>
        <input type="radio" name="answer" id="o1" value="1">
        <label class="pre-wrap" for="o1" id="o1-label">Válasz 2</label>
        <br>
        <input type="radio" name="answer" id="o2" value="2">
        <label class="pre-wrap" for="o2" id="o2-label">Válasz 3</label>
        <br>
        <input type="radio" name="answer" id="o3" value="3">
        <label class="pre-wrap" for="o3" id="o3-label">Válasz 4</label>
        <br>

        <div class="center">
            <input id="next-btn" type="button" value="Következő" onclick="nextQuestion();">
        </div>

        <p class="center" id="question-counter">0/20</p>
    </div>

    <script src="../js/quiz_script.js"></script>
</body>
</html>
